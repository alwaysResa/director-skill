name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install ffmpeg and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil
      - name: Smoke test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test
